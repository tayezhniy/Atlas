
[project]
name = "medium_python"
version = "0.1.0"
description = "Medium Python project for Atlas benchmarking"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "redis>=4.5",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
