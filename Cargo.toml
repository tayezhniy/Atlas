[workspace]
resolver = "2"
members = [
    "crates/atlas-store",
    "crates/atlas-core",
    "crates/atlas-langs",
    "crates/atlas-indexer",
    "crates/atlas-mcp",
    "crates/atlas-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
# Версии зависимостей, общие для всего рабочего пространства
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
ignore = "0.4"
notify = "6"
petgraph = "0.6"
tree-sitter = "0.22"
# mcp = "0.4" — отключено: будет добавлено на этапе MCP (раздел 8 ТЗ)
clap = { version = "4", features = ["derive"] }